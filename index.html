<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Weekday Recipe Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { background: #030712; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-white">🍳 Random Recipe Generator</h1>
    <p class="text-gray-400 text-sm mt-1">Pick your ingredients and cuisine for a random weekday recipe</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Selectors -->
    <div class="space-y-5">
      <div class="bg-gray-900 rounded-xl p-5 border border-gray-800">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">🥩 Protein</h2>
        <div id="proteins" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="bg-gray-900 rounded-xl p-5 border border-gray-800">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">🥦 Vegetables</h2>
        <div id="veggies" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="bg-gray-900 rounded-xl p-5 border border-gray-800">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">🌍 Cuisine</h2>
        <div id="cuisines" class="flex flex-wrap gap-2"></div>
      </div>
      <button onclick="generateRecipe()" class="w-full bg-gradient-to-r from-orange-600 to-pink-600 hover:from-orange-500 hover:to-pink-500 text-white px-4 py-3 rounded-xl font-bold text-sm transition-all shadow-lg">🎲 Generate Recipe</button>
    </div>

    <!-- Recipe Card -->
    <div class="lg:col-span-2">
      <div id="recipe-card" class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden min-h-64">
        <div class="flex items-center justify-center h-64 text-gray-600 flex-col gap-3">
          <span class="text-5xl">🍽️</span>
          <span class="text-sm">Select ingredients and generate a recipe!</span>
        </div>
      </div>

      <!-- Favorites -->
      <div class="mt-4 bg-gray-900 rounded-xl border border-gray-800">
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
          <h2 class="text-sm font-semibold text-gray-300">❤️ Saved Favorites</h2>
          <span id="fav-count" class="text-xs text-gray-500">0 saved</span>
        </div>
        <div id="favorites-list" class="divide-y divide-gray-800 max-h-48 overflow-y-auto">
          <div class="p-4 text-center text-gray-600 text-sm">No favorites yet</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const OPTIONS = {
  proteins: ['🐔 Chicken', '🥩 Beef', '🧈 Tofu', '🥚 Eggs', '🐟 Fish', '🦐 Shrimp', '🥓 Bacon', '🫘 Lentils'],
  veggies:  ['🥦 Broccoli', '🌿 Spinach', '🍅 Tomato', '🧅 Onion', '🥕 Carrot', '🌶️ Bell Pepper', '🍄 Mushroom', '🥒 Zucchini', '🌽 Corn', '🧄 Garlic'],
  cuisines: ['🇮🇹 Italian', '🍜 Asian', '🌮 Mexican', '🫒 Mediterranean', '🇮🇳 Indian', '🇫🇷 French', '🇯🇵 Japanese', '🇬🇷 Greek']
};

let selected = { proteins: [], veggies: [], cuisines: [] };
let favorites = JSON.parse(localStorage.getItem('recipeFavorites') || '[]');
let lastRecipe = null;

const RECIPES = {
  'Italian': {
    templates: [
      { name: '{P} Pasta Primavera', time: 25, serves: 2, intro: 'A classic Italian pasta dish', method: ['Boil pasta al dente in salted water','Sauté {V} in olive oil with garlic','Add {P} and cook until done','Toss with pasta and fresh basil','Season with salt, pepper, and parmesan'] },
      { name: '{P} Risotto with {V}', time: 40, serves: 4, intro: 'Creamy Italian rice dish', method: ['Heat broth and keep warm','Sauté onion in butter, add arborio rice','Add wine and stir until absorbed','Add broth ladle by ladle, stirring constantly','Fold in {P}, {V}, and parmesan at the end'] },
    ]
  },
  'Asian': {
    templates: [
      { name: '{P} Stir-Fry with {V}', time: 20, serves: 2, intro: 'Quick and flavorful stir-fry', method: ['Marinate {P} in soy sauce, ginger, sesame oil','Heat wok to high heat with oil','Stir-fry {P} until cooked, set aside','Add {V} to wok and stir-fry 3-4 minutes','Combine with sauce, serve over jasmine rice'] },
      { name: '{V} Fried Rice with {P}', time: 15, serves: 2, intro: 'Classic Asian fried rice', method: ['Cook rice ahead and let cool','Heat oil in wok, scramble eggs','Add {V} and stir-fry briefly','Add cold rice, toss vigorously','Add {P}, soy sauce, and sesame oil to finish'] },
    ]
  },
  'Mexican': {
    templates: [
      { name: '{P} Tacos with {V}', time: 20, serves: 4, intro: 'Vibrant Mexican street-style tacos', method: ['Season {P} with cumin, chili powder, garlic','Cook in cast iron until caramelized','Warm corn tortillas on dry griddle','Prepare {V} with lime juice and salt','Serve with salsa, avocado, and fresh cilantro'] },
      { name: '{P} Burrito Bowl with {V}', time: 30, serves: 2, intro: 'Hearty burrito bowl', method: ['Cook seasoned rice with lime and cilantro','Season and cook {P} with Mexican spices','Sauté {V} with onion and garlic','Layer rice, {P}, {V} in bowl','Top with salsa, sour cream, and cheese'] },
    ]
  },
  'Mediterranean': {
    templates: [
      { name: 'Mediterranean {P} with {V}', time: 35, serves: 4, intro: 'Fresh Mediterranean flavors', method: ['Marinate {P} in olive oil, lemon, oregano, garlic','Roast or grill {P} until cooked through','Roast {V} with olive oil and herbs de provence','Prepare a simple tzatziki with yogurt and cucumber','Serve with pita bread and lemon wedges'] },
      { name: '{P} and {V} Mezze Plate', time: 20, serves: 2, intro: 'A colorful mezze spread', method: ['Prepare hummus with chickpeas and tahini','Grill {P} with olive oil and lemon','Roast {V} with garlic and herbs','Arrange on platter with olives and feta','Drizzle with extra virgin olive oil'] },
    ]
  },
  'Indian': {
    templates: [
      { name: '{P} Curry with {V}', time: 40, serves: 4, intro: 'Aromatic Indian curry', method: ['Bloom cumin, coriander, turmeric in oil','Add onion, ginger, garlic paste and cook','Add tomatoes and cook into a thick masala','Add {P} and {V}, simmer 20 minutes','Finish with garam masala and fresh cilantro'] },
    ]
  },
  'French': {
    templates: [
      { name: '{P} Provençal with {V}', time: 45, serves: 4, intro: 'Classic French country cooking', method: ['Season {P} generously with herbs de provence','Brown in butter until golden on all sides','Deglaze with white wine and add {V}','Simmer low and slow until tender','Finish with fresh thyme and a knob of butter'] },
    ]
  },
  'Japanese': {
    templates: [
      { name: '{P} Teriyaki with {V}', time: 25, serves: 2, intro: 'Glossy Japanese teriyaki', method: ['Make teriyaki sauce: soy, mirin, sake, sugar','Marinate {P} for 30 minutes minimum','Cook {V} in sesame oil until tender-crisp','Pan-fry {P} and glaze with teriyaki sauce','Serve over steamed rice with sesame seeds'] },
    ]
  },
  'Greek': {
    templates: [
      { name: 'Greek {P} with {V} and Feta', time: 30, serves: 4, intro: 'Sun-soaked Greek flavors', method: ['Marinate {P} in olive oil, lemon, oregano','Grill or roast {P} until cooked through','Toss {V} with olive oil, salt, oregano','Roast {V} until slightly caramelized','Serve with feta, olives, and warm pita'] },
    ]
  }
};

function renderTags(category, el) {
  const container = document.getElementById(el);
  container.innerHTML = OPTIONS[category].map(opt => {
    const isSelected = selected[category].includes(opt);
    return `<button onclick="toggleTag('${category}','${opt.replace(/'/g,"\\'")}')"
      class="px-3 py-1.5 rounded-full text-xs font-medium transition-all border ${isSelected ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-300 hover:border-gray-500'}"
      aria-pressed="${isSelected}">${escapeHtml(opt)}</button>`;
  }).join('');
}

function toggleTag(category, value) {
  const idx = selected[category].indexOf(value);
  if (idx >= 0) selected[category].splice(idx, 1);
  else selected[category].push(value);
  renderTags(category, category === 'proteins' ? 'proteins' : category === 'veggies' ? 'veggies' : 'cuisines');
}

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateRecipe() {
  const proteins = selected.proteins.length ? selected.proteins : OPTIONS.proteins;
  const veggies  = selected.veggies.length  ? selected.veggies  : OPTIONS.veggies;
  const cuisines = selected.cuisines.length ? selected.cuisines : OPTIONS.cuisines;

  const protein = rand(proteins).replace(/^.*? /, '');
  const veggie  = rand(veggies).replace(/^.*? /, '');
  const cuisine = rand(cuisines).replace(/^.*? /, '');

  const cuisineRecipes = RECIPES[cuisine] || RECIPES['Italian'];
  const template = rand(cuisineRecipes.templates);

  const time = template.time + Math.floor(Math.random() * 10 - 5);
  const serves = template.serves;

  const extras = {
    Italian: ['parmesan', 'fresh basil', 'olive oil', 'garlic bread'],
    Asian: ['jasmine rice', 'sesame seeds', 'spring onion', 'lime'],
    Mexican: ['corn tortillas', 'lime', 'cilantro', 'salsa'],
    Mediterranean: ['pita bread', 'hummus', 'feta cheese', 'olives'],
    Indian: ['basmati rice', 'naan bread', 'yogurt', 'mango chutney'],
    French: ['baguette', 'dijon mustard', 'white wine', 'butter'],
    Japanese: ['steamed rice', 'nori', 'pickled ginger', 'wasabi'],
    Greek: ['pita bread', 'tzatziki', 'olives', 'feta cheese']
  };
  const extra = rand(extras[cuisine] || extras['Italian']);
  const ingredients = [protein, veggie, extra, 'olive oil', 'salt & pepper', 'garlic'];

  const recipeName = template.name.replace('{P}', protein).replace('{V}', veggie);
  const steps = template.method.map(s => s.replace(/\{P\}/g, protein).replace(/\{V\}/g, veggie));

  lastRecipe = { name: recipeName, time, serves, intro: template.intro, ingredients, steps, cuisine };
  renderRecipe(lastRecipe);
}

function renderRecipe(r) {
  const card = document.getElementById('recipe-card');
  const flag = { Italian:'🇮🇹', Asian:'🍜', Mexican:'🌮', Mediterranean:'🫒', Indian:'🇮🇳', French:'🇫🇷', Japanese:'🇯🇵', Greek:'🇬🇷' };
  card.innerHTML = `
    <div class="bg-gradient-to-br from-orange-950 to-pink-950 px-6 pt-6 pb-4 border-b border-gray-700">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-xs font-semibold text-orange-400 uppercase tracking-wide mb-1">${flag[r.cuisine]||''} ${escapeHtml(r.cuisine)} Cuisine</div>
          <h3 class="text-xl font-bold text-white">${escapeHtml(r.name)}</h3>
          <p class="text-sm text-gray-400 mt-1">${escapeHtml(r.intro)}</p>
        </div>
        <button onclick="saveRecipe()" class="bg-gray-800 hover:bg-red-800 text-gray-300 hover:text-red-300 px-3 py-2 rounded-lg text-xs font-medium transition-colors flex-shrink-0">❤️ Save</button>
      </div>
      <div class="flex gap-4 mt-4">
        <span class="flex items-center gap-1 text-sm text-gray-300"><span>⏱</span> ${r.time} min</span>
        <span class="flex items-center gap-1 text-sm text-gray-300"><span>👥</span> Serves ${r.serves}</span>
      </div>
    </div>
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Ingredients</h4>
        <ul class="space-y-1.5">
          ${r.ingredients.map(i => `<li class="flex items-center gap-2 text-sm text-gray-200"><span class="w-1.5 h-1.5 bg-orange-400 rounded-full flex-shrink-0"></span>${escapeHtml(i)}</li>`).join('')}
        </ul>
      </div>
      <div>
        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Instructions</h4>
        <ol class="space-y-2">
          ${r.steps.map((s,i) => `<li class="flex gap-3 text-sm text-gray-300"><span class="flex-shrink-0 w-5 h-5 bg-orange-600 rounded-full text-white text-xs font-bold flex items-center justify-center mt-0.5">${i+1}</span><span>${escapeHtml(s)}</span></li>`).join('')}
        </ol>
      </div>
    </div>`;
}

function saveRecipe() {
  if (!lastRecipe) return;
  const exists = favorites.some(f => f.name === lastRecipe.name);
  if (exists) { alert('Already saved!'); return; }
  favorites.unshift({ ...lastRecipe, savedAt: Date.now() });
  localStorage.setItem('recipeFavorites', JSON.stringify(favorites));
  renderFavorites();
}

function removeFavorite(idx) {
  favorites.splice(idx, 1);
  localStorage.setItem('recipeFavorites', JSON.stringify(favorites));
  renderFavorites();
}

function renderFavorites() {
  const el = document.getElementById('favorites-list');
  document.getElementById('fav-count').textContent = favorites.length + ' saved';
  if (favorites.length === 0) {
    el.innerHTML = '<div class="p-4 text-center text-gray-600 text-sm">No favorites yet</div>';
    return;
  }
  el.innerHTML = favorites.map((r, i) => `
    <div class="flex items-center justify-between p-3 hover:bg-gray-800/50 transition-colors">
      <div>
        <div class="text-sm font-medium text-gray-200">${escapeHtml(r.name)}</div>
        <div class="text-xs text-gray-500">${r.cuisine} · ${r.time} min · Serves ${r.serves}</div>
      </div>
      <div class="flex gap-2">
        <button onclick="loadFavorite(${i})" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">View</button>
        <button onclick="removeFavorite(${i})" class="text-xs text-gray-600 hover:text-red-400 transition-colors">×</button>
      </div>
    </div>`).join('');
}

function loadFavorite(idx) {
  lastRecipe = favorites[idx];
  renderRecipe(favorites[idx]);
}

// Init
renderTags('proteins', 'proteins');
renderTags('veggies', 'veggies');
renderTags('cuisines', 'cuisines');
renderFavorites();
</script>
</body>
</html>
